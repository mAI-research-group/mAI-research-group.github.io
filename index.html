<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>mAI Lab</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }

    #vanta-bg {
      width: 100%;
      height: 100%;
      position: fixed;
      z-index: -1;
    }

    .content {
      position: absolute;
      top: 30%;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 4rem;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
    }

    p {
      font-size: 1.5rem;
      margin-top: 1rem;
      text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div id="vanta-bg"></div>
  <div class="content">
    <h1>mAI Lab</h1>
    <p>Multi-Modal Learning with an Impression</p>
  </div>

  <!-- Vanta.js & Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
  <script>
    VANTA.WAVES({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0x8ecae6,
      shininess: 30.00,
      waveHeight: 10.00,
      waveSpeed: 0.5,
      zoom: 1.2,
      backgroundImage: 'background.jpg'
    });
  </script>
</body>
</html>
